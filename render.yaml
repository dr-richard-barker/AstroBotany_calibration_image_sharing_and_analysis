# Render Blueprint — one-click deploy of the AstroBotany Calibration Image DB.
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New +" → "Blueprint" and point it at this repository. Render reads this file,
# provisions the web service + a persistent disk for the database, and builds.
#
# The `starter` plan is used because it includes a persistent disk (the app is a
# database — the SQLite file and uploaded images must survive restarts/deploys).
# To try it for free, change `plan: starter` to `plan: free` and DELETE the
# `disk:` block below — but note free instances have an EPHEMERAL filesystem
# (all contributed images reset on redeploy) and spin down when idle.

services:
  - type: web
    name: astrobotany-calibration-db
    runtime: node
    plan: starter
    region: oregon
    branch: main
    # --include=dev forces devDependencies (vite/esbuild) even though NODE_ENV
    # is production, so the build tools are available at build time.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
    disk:
      name: astrobotany-data
      mountPath: /var/data
      sizeGB: 1
